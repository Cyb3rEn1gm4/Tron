<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎡 Колесо Фортуны</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 20% 10%, #2a1b4e, #0f0c1d 65%);
    color: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    display: flex;
    gap: 34px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    max-width: 1180px;
    width: 100%;
  }
  .panel {
    width: 320px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px;
    padding: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 50px -20px rgba(0,0,0,.8);
  }
  h1 { font-size: 21px; margin: 0 0 14px; letter-spacing: .3px; }
  label { font-size: 13px; opacity: .7; display: block; margin-bottom: 8px; }
  textarea {
    width: 100%; height: 190px; resize: vertical;
    border-radius: 12px; border: 1px solid rgba(255,255,255,.15);
    background: rgba(0,0,0,.35); color: #fff;
    padding: 12px; font-size: 14px; font-family: inherit;
    line-height: 1.55; outline: none; transition: border-color .2s;
  }
  textarea:focus { border-color: #8b5cf6; }
  .btns { display: flex; gap: 10px; margin-top: 14px; }
  button {
    padding: 13px; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: transform .15s, filter .15s;
  }
  #spin {
    flex: 1;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    color: #fff;
    box-shadow: 0 10px 26px -10px #8b5cf6;
  }
  .secondary { flex: 0 0 112px; background: rgba(255,255,255,.1); color: #fff; }
  button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.12); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .result {
    margin-top: 16px; text-align: center;
    font-size: 16px; font-weight: 700; min-height: 56px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px; background: rgba(0,0,0,.25);
    padding: 10px; word-break: break-word; transition: background .3s;
  }
  .result.pop {
    animation: pop .55s cubic-bezier(.34,1.56,.64,1);
    background: linear-gradient(135deg, rgba(139,92,246,.55), rgba(236,72,153,.55));
    font-size: 22px;
    box-shadow: 0 0 30px -6px rgba(236,72,153,.6);
  }
  @keyframes pop {
    0% { transform: scale(.8); }
    60% { transform: scale(1.09); }
    100% { transform: scale(1); }
  }
  .wheelWrap {
    width: min(82vmin, 610px);
    aspect-ratio: 1;
    position: relative;
  }
  canvas {
    width: 100%; height: 100%; display: block;
    filter: drop-shadow(0 24px 55px rgba(139,92,246,.35));
  }
  @media (max-width: 720px) {
    .app { gap: 22px; }
    .panel { width: min(100%, 420px); }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="panel">
    <h1>🎡 Колесо Фортуны</h1>
    <label>Что должно быть на колесе? (каждый вариант — с новой строки)</label>
    <textarea id="items">Пицца
Суши
Бургеры
Паста
Салат
Шаурма</textarea>
    <div class="btns">
      <button id="spin">Крутить!</button>
      <button id="apply" class="secondary">Обновить</button>
    </div>
    <div id="result" class="result">Впиши варианты и жми «Крутить»</div>
  </aside>

  <main class="wheelWrap">
    <canvas id="wheel"></canvas>
  </main>
</div>

<script>
(() => {
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const SIZE = 800;
  canvas.width = SIZE;
  canvas.height = SIZE;

  const cx = SIZE / 2, cy = SIZE / 2, R = SIZE / 2 - 30;
  const resultEl = document.getElementById('result');
  const spinBtn = document.getElementById('spin');
  const applyBtn = document.getElementById('apply');
  const textarea = document.getElementById('items');

  const PALETTE = ['#FF6B6B','#4ECDC4','#FFD93D','#8B5CF6','#FF8E53','#45B7D1',
                   '#F368E0','#26DE81','#FD9644','#A55EEA','#20BF6B','#EB3B5A'];

  let items = [];
  let colors = [];
  let rotation = 0;
  let spinning = false;
  let winnerIdx = null;

  /* ---------- Сбор вариантов ---------- */
  function buildItems(reset) {
    const raw = textarea.value;
    items = raw.split('\n').map(s => s.trim()).filter(s => s.length > 0);
    if (items.length === 0) items = ['Пусто?', 'Добавь варианты'];
    colors = items.map((_, i) => PALETTE[i % PALETTE.length]);
    if (reset) {
      rotation = 0;
      winnerIdx = null;
      resultEl.classList.remove('pop');
      resultEl.textContent = 'Впиши варианты и жми «Крутить»';
    }
    draw();
  }

  /* ---------- Отрисовка ---------- */
  function fitText(text, fontSize, maxWidth) {
    ctx.font = `700 ${fontSize}px "Segoe UI", system-ui, sans-serif`;
    if (ctx.measureText(text).width <= maxWidth) return text;
    let t = text;
    while (t.length > 1 && ctx.measureText(t + '…').width > maxWidth) {
      t = t.slice(0, -1);
    }
    return t + '…';
  }

  function draw() {
    ctx.clearRect(0, 0, SIZE, SIZE);

    const n = items.length;
    const seg = (Math.PI * 2) / n;

    // Сектора
    for (let i = 0; i < n; i++) {
      const start = i * seg + rotation;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, R, start, start + seg);
      ctx.closePath();
      ctx.fillStyle = colors[i];
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.18)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // Подсветка победителя
    if (winnerIdx !== null && !spinning && winnerIdx < n) {
      const start = winnerIdx * seg + rotation;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, R, start, start + seg);
      ctx.closePath();
      ctx.strokeStyle = 'rgba(255,255,255,.95)';
      ctx.lineWidth = 7;
      ctx.stroke();
    }

    // Текст
    const fontSize = n <= 6 ? 32 : n <= 9 ? 27 : n <= 14 ? 22 : n <= 20 ? 18 : n <= 28 ? 15 : 12;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';

    for (let i = 0; i < n; i++) {
      const mid = i * seg + seg / 2 + rotation;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(mid);
      ctx.fillStyle = 'rgba(20,15,35,.88)';
      const label = fitText(items[i], fontSize, R * 0.66);
      ctx.font = `700 ${fontSize}px "Segoe UI", system-ui, sans-serif`;
      ctx.fillText(label, R - 32, 0);
      ctx.restore();
    }

    // Внешний обод
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 12;
    ctx.stroke();

    // Ступица
    const hub = ctx.createRadialGradient(cx - 12, cy - 12, 5, cx, cy, 52);
    hub.addColorStop(0, '#ffffff');
    hub.addColorStop(1, '#cfc6ea');
    ctx.beginPath();
    ctx.arc(cx, cy, 50, 0, Math.PI * 2);
    ctx.fillStyle = hub;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, 17, 0, Math.PI * 2);
    ctx.fillStyle = '#8b5cf6';
    ctx.fill();

    // Указатель сверху
    ctx.beginPath();
    ctx.moveTo(cx - 26, cy - R - 22);
    ctx.lineTo(cx + 26, cy - R - 22);
    ctx.lineTo(cx, cy - R + 34);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(0,0,0,.55)';
    ctx.shadowBlur = 14;
    ctx.shadowOffsetY = 5;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
  }

  /* ---------- Вращение ---------- */
  function spin() {
    if (spinning) return;

    buildItems(false);
    const n = items.length;
    const seg = (Math.PI * 2) / n;

    spinning = true;
    winnerIdx = null;
    spinBtn.disabled = true;
    resultEl.classList.remove('pop');
    resultEl.textContent = 'Крутится… 🌀';

    // Случайный победитель
    const idx = Math.floor(Math.random() * n);
    const pointerAngle = -Math.PI / 2;

    // Поворот, при котором центр сектора idx окажется под указателем
    const base = pointerAngle - (idx + 0.5) * seg;
    const turns = 5 + Math.floor(Math.random() * 3);
    const startRot = rotation;
    const k = Math.ceil((startRot + turns * Math.PI * 2 - base) / (Math.PI * 2));
    const finalRot = base + k * Math.PI * 2;

    const duration = 4200 + Math.random() * 900;
    const t0 = performance.now();

    function frame(now) {
      const p = Math.min(1, (now - t0) / duration);
      const eased = 1 - Math.pow(1 - p, 4);          // плавное замедление
      rotation = startRot + (finalRot - startRot) * eased;
      draw();

      if (p < 1) {
        requestAnimationFrame(frame);
      } else {
        rotation = finalRot % (Math.PI * 2);
        spinning = false;
        winnerIdx = idx;
        draw();
        spinBtn.disabled = false;
        resultEl.textContent = items[idx];
        resultEl.classList.add('pop');
      }
    }
    requestAnimationFrame(frame);
  }

  /* ---------- События ---------- */
  spinBtn.addEventListener('click', spin);
  applyBtn.addEventListener('click', () => buildItems(true));
  textarea.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) spin();
  });

  // Старт
  buildItems(true);
})();
</script>
</body>
</html>
