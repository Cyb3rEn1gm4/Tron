<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎡 Колесо Фортуны — Доклады</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 30% 0%, #2a1b4e 0%, #0f0c1d 60%);
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    overflow-x: hidden;
  }
  h1 {
    font-size: clamp(20px, 3vw, 28px);
    margin-bottom: 16px;
    text-align: center;
    background: linear-gradient(135deg, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .wheel-wrap {
    position: relative;
    width: min(88vmin, 620px);
    aspect-ratio: 1;
  }
  canvas#wheel {
    width: 100%; height: 100%; display: block;
    filter: drop-shadow(0 20px 60px rgba(139,92,246,.4));
  }
  .spin-btn {
    margin-top: 24px;
    padding: 18px 56px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .5px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    box-shadow: 0 14px 34px -10px #8b5cf6;
    transition: transform .15s, filter .15s;
    font-family: inherit;
  }
  .spin-btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.12); }
  .spin-btn:active:not(:disabled) { transform: translateY(0); }
  .spin-btn:disabled { opacity: .5; cursor: not-allowed; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(10, 8, 20, .78);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 50;
    opacity: 0; pointer-events: none;
    transition: opacity .3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: linear-gradient(160deg, #2a1b4e, #1a1230);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 24px;
    padding: 36px 32px;
    text-align: center;
    max-width: 420px; width: 100%;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.9);
    transform: scale(.85);
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .overlay.show .modal { transform: scale(1); }
  .modal .emoji { font-size: 48px; margin-bottom: 8px; }
  .modal .win-label {
    font-size: 15px; text-transform: uppercase;
    letter-spacing: 2px; opacity: .65; margin-bottom: 10px;
  }
  .modal .winner-name {
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 800; line-height: 1.25; margin-bottom: 18px;
    background: linear-gradient(135deg, #a78bfa, #f472b6, #fbbf24);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; word-break: break-word;
  }
  .modal .win-message {
    font-size: 19px; font-weight: 800;
    color: #fbbf24; margin-bottom: 26px;
    text-shadow: 0 0 22px rgba(251,191,36,.5);
  }
  .modal .again-btn {
    padding: 14px 32px; font-size: 16px; font-weight: 700;
    border: none; border-radius: 12px; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    box-shadow: 0 10px 24px -8px #8b5cf6;
    font-family: inherit; transition: transform .15s, filter .15s;
  }
  .modal .again-btn:hover { transform: translateY(-2px); filter: brightness(1.12); }

  #confetti {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 60;
  }

  .edit-toggle {
    margin-top: 20px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    color: #ccc; padding: 10px 18px; border-radius: 10px;
    cursor: pointer; font-family: inherit; font-size: 14px;
    transition: background .2s;
  }
  .edit-toggle:hover { background: rgba(255,255,255,.14); }
  .editor {
    margin-top: 14px;
    width: min(88vmin, 620px);
    display: none;
  }
  .editor.open { display: block; }
  .editor textarea {
    width: 100%; height: 240px; resize: vertical;
    border-radius: 12px; border: 1px solid rgba(255,255,255,.15);
    background: rgba(0,0,0,.4); color: #fff;
    padding: 12px; font-size: 14px; font-family: inherit;
    line-height: 1.6; outline: none; transition: border-color .2s;
  }
  .editor textarea:focus { border-color: #8b5cf6; }
  .editor .editor-btns { display: flex; gap: 10px; margin-top: 10px; }
  .editor .editor-btns button {
    flex: 1; padding: 11px; border-radius: 10px; border: none;
    font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; color: #fff;
    transition: transform .15s, filter .15s;
  }
  .editor .apply-btn { background: linear-gradient(135deg, #10b981, #059669); }
  .editor .cancel-btn { background: rgba(255,255,255,.12); }
  .editor .editor-btns button:hover { transform: translateY(-1px); filter: brightness(1.1); }
</style>
</head>
<body>

<h1>🎡 Колесо Фортуны — Кто делает доклад?</h1>

<div class="wheel-wrap">
  <canvas id="wheel"></canvas>
</div>

<button class="spin-btn" id="spin">Крутить!</button>
<button class="edit-toggle" id="editToggle">⚙️ Изменить список</button>

<div class="editor" id="editor">
  <textarea id="items"></textarea>
  <div class="editor-btns">
    <button class="apply-btn" id="apply">Применить</button>
    <button class="cancel-btn" id="cancel">Закрыть</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="emoji">🎉</div>
    <div class="win-label">Выбран</div>
    <div class="winner-name" id="winnerName">—</div>
    <div class="win-message">🏆 Ты выиграл доклад!</div>
    <button class="again-btn" id="again">Крутить ещё</button>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
(() => {
  const DEFAULT_NAMES = [
    "Василига Олег",
    "Мария Волощук",
    "Давыдов Николай",
    "Данилина Виктория",
    "Дубков Даниил",
    "Калинина Анастасия",
    "Копаев Никита",
    "Кубарева Полина",
    "Лебедев Константин",
    "Летецкая Александра",
    "Малова Эмилия",
    "Пирогов Максим",
    "Владислав Пойда",
    "Серкина Анастасия",
    "Солохненко Александр",
    "Шлык Ольга",
    "Басова Виктория",
    "Михаил Гудилин",
    "Ксения Дарабанская",
    "Ларина Даниэла",
    "Мякотина Мария"
  ];

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const SIZE = 800;
  canvas.width = SIZE; canvas.height = SIZE;
  const cx = SIZE / 2, cy = SIZE / 2, R = SIZE / 2 - 28;

  const overlay = document.getElementById('overlay');
  const winnerNameEl = document.getElementById('winnerName');
  const spinBtn = document.getElementById('spin');
  const againBtn = document.getElementById('again');
  const textarea = document.getElementById('items');
  const editor = document.getElementById('editor');
  const editToggle = document.getElementById('editToggle');
  const applyBtn = document.getElementById('apply');
  const cancelBtn = document.getElementById('cancel');

  let items = [];
  let colors = [];
  let rotation = 0;
  let spinning = false;
  let winnerIdx = null;
  let highlightPulse = 0;

  function makeColors(n) {
    const arr = [];
    for (let i = 0; i < n; i++) {
      const hue = (i * 360 / n + 8) % 360;
      arr.push(`hsl(${hue}, 72%, 58%)`);
    }
    return arr;
  }

  function loadFromTextarea(reset) {
    const raw = textarea.value;
    items = raw.split('\n').map(s => s.trim()).filter(s => s.length > 0);
    if (items.length === 0) items = ['Добавь имена'];
    colors = makeColors(items.length);
    if (reset) { rotation = 0; winnerIdx = null; }
    draw();
  }

  function fitText(text, fontSize, maxWidth) {
    ctx.font = `700 ${fontSize}px "Segoe UI", system-ui, sans-serif`;
    if (ctx.measureText(text).width <= maxWidth) return text;
    let t = text;
    while (t.length > 1 && ctx.measureText(t + '…').width > maxWidth) {
      t = t.slice(0, -1);
    }
    return t + '…';
  }

  function draw() {
    ctx.clearRect(0, 0, SIZE, SIZE);
    const n = items.length;
    const seg = (Math.PI * 2) / n;

    for (let i = 0; i < n; i++) {
      const start = i * seg + rotation;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, R, start, start + seg);
      ctx.closePath();
      ctx.fillStyle = colors[i];
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.22)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    if (winnerIdx !== null && !spinning && winnerIdx < n) {
      const start = winnerIdx * seg + rotation;
      const glow = 0.5 + 0.5 * Math.sin(highlightPulse);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, R, start, start + seg);
      ctx.closePath();
      ctx.strokeStyle = `rgba(255,255,255,${0.7 + 0.3 * glow})`;
      ctx.lineWidth = 8;
      ctx.stroke();
    }

    const fontSize = n <= 6 ? 30 : n <= 10 ? 25 : n <= 16 ? 20 : n <= 22 ? 16 : 13;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';

    for (let i = 0; i < n; i++) {
      const mid = i * seg + seg / 2 + rotation;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(mid);
      ctx.fillStyle = 'rgba(15,10,25,.92)';
      const label = fitText(items[i], fontSize, R * 0.7);
      ctx.font = `700 ${fontSize}px "Segoe UI", system-ui, sans-serif`;
      ctx.fillText(label, R - 30, 0);
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 12;
    ctx.stroke();

    const hub = ctx.createRadialGradient(cx - 12, cy - 12, 5, cx, cy, 50);
    hub.addColorStop(0, '#ffffff');
    hub.addColorStop(1, '#cfc6ea');
    ctx.beginPath();
    ctx.arc(cx, cy, 48, 0, Math.PI * 2);
    ctx.fillStyle = hub;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, 16, 0, Math.PI * 2);
    ctx.fillStyle = '#8b5cf6';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cx - 24, cy - R - 20);
    ctx.lineTo(cx + 24, cy - R - 20);
    ctx.lineTo(cx, cy - R + 32);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(0,0,0,.6)';
    ctx.shadowBlur = 14;
    ctx.shadowOffsetY = 5;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
  }

  function pulseLoop() {
    if (winnerIdx !== null && !spinning) {
      highlightPulse += 0.12;
      draw();
    }
    requestAnimationFrame(pulseLoop);
  }
  pulseLoop();

  function spin() {
    if (spinning) return;
    loadFromTextarea(false);
    const n = items.length;
    const seg = (Math.PI * 2) / n;

    spinning = true;
    winnerIdx = null;
    spinBtn.disabled = true;
    overlay.classList.remove('show');

    const idx = Math.floor(Math.random() * n);
    const pointerAngle = -Math.PI / 2;
    const base = pointerAngle - (idx + 0.5) * seg;
    const turns = 5 + Math.floor(Math.random() * 3);
    const startRot = rotation;
    const k = Math.ceil((startRot + turns * Math.PI * 2 - base) / (Math.PI * 2));
    const finalRot = base + k * Math.PI * 2;

    const duration = 4400 + Math.random() * 900;
    const t0 = performance.now();

    function frame(now) {
      const p = Math.min(1, (now - t0) / duration);
      const eased = 1 - Math.pow(1 - p, 4);
      rotation = startRot + (finalRot - startRot) * eased;
      draw();
      if (p < 1) {
        requestAnimationFrame(frame);
      } else {
        rotation = finalRot % (Math.PI * 2);
        spinning = false;
        winnerIdx = idx;
        draw();
        spinBtn.disabled = false;
        showWinner(items[idx]);
      }
    }
    requestAnimationFrame(frame);
  }

  function showWinner(name) {
    winnerNameEl.textContent = name;
    overlay.classList.add('show');
    launchConfetti();
  }

  const confCanvas = document.getElementById('confetti');
  const confCtx = confCanvas.getContext('2d');
  let confParticles = [];
  let confRunning = false;
  let confEndTime = 0;

  function resizeConfetti() {
    confCanvas.width = window.innerWidth;
    confCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeConfetti);
  resizeConfetti();

  function launchConfetti() {
    const W = confCanvas.width;
    const cols = ['#a78bfa', '#f472b6', '#fbbf24', '#34d399', '#60a5fa', '#fb7185', '#f9a8d4'];
    confParticles = [];
    for (let i = 0; i < 180; i++) {
      confParticles.push({
        x: Math.random() * W,
        y: -20 - Math.random() * 300,
        vx: (Math.random() - 0.5) * 3,
        vy: 2 + Math.random() * 4,
        size: 6 + Math.random() * 8,
        color: cols[Math.floor(Math.random() * cols.length)],
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.25,
        shape: Math.random() < 0.5 ? 'rect' : 'circle'
      });
    }
    confEndTime = performance.now() + 4200;
    if (!confRunning) { confRunning = true; requestAnimationFrame(confFrame); }
  }

  function confFrame(now) {
    const W = confCanvas.width, H = confCanvas.height;
    confCtx.clearRect(0, 0, W, H);
    const alive = [];
    for (const p of confParticles) {
      p.vy += 0.08;
      p.vx *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.y < H + 30) alive.push(p);

      confCtx.save();
      confCtx.translate(p.x, p.y);
      confCtx.rotate(p.rot);
      confCtx.fillStyle = p.color;
      if (p.shape === 'rect') {
        confCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      } else {
        confCtx.beginPath();
        confCtx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        confCtx.fill();
      }
      confCtx.restore();
    }
    confParticles = alive;
    if (now < confEndTime && confParticles.length > 0) {
      requestAnimationFrame(confFrame);
    } else {
      confCtx.clearRect(0, 0, W, H);
      confRunning = false;
    }
  }

  spinBtn.addEventListener('click', spin);
  againBtn.addEventListener('click', () => {
    overlay.classList.remove('show');
    setTimeout(spin, 150);
  });

  editToggle.addEventListener('click', () => {
    editor.classList.toggle('open');
    if (editor.classList.contains('open')) textarea.focus();
  });
  cancelBtn.addEventListener('click', () => editor.classList.remove('open'));
  applyBtn.addEventListener('click', () => {
    loadFromTextarea(true);
    editor.classList.remove('open');
  });

  textarea.value = DEFAULT_NAMES.join('\n');
  loadFromTextarea(true);
})();
</script>
</body>
</html>
